<!doctype html><html lang="ko"><meta charset="utf-8"><title>8방향 보행 제작 검수</title>
<style>body{background:#171c22;color:#e8edf3;font:16px system-ui;margin:24px}h1{font-size:24px}p{color:#b5c1cf}button,select,input{margin:8px;padding:8px}canvas{display:block;max-width:100%;background:#303940;border-radius:8px}a{color:#75dcd1}.pending{color:#ffd28b}</style>
<h1>최종 8방향 · 현재 대표 4방향 보행 시험</h1>
<p>제작 후보 — 본 게임 미적용. 위: 연속재생 3배 확대 / 아래: 74px 실제 목표 크기. 청록 십자는 발 기준점입니다.</p>
<button id="play">일시정지</button><button id="next">한 컷 넘기기</button><label>재생속도 <input id="fps" type="range" min="2" max="12" value="6"> <span id="rate">6</span> fps</label>
<select id="bg"><option value="#303940">회색</option><option value="#eee6d4">밝은 바닥</option><option value="#17231e">어두운 바닥</option><option value="#687344">녹색 바닥</option></select><span id="phase"></span>
<canvas id="view" width="1200" height="520"></canvas>
<p class="pending">대각선 FRONT-RIGHT / FRONT-LEFT / BACK-LEFT / BACK-RIGHT: 미제작. 4방향을 복제하거나 뒤집어 8방향 완료로 처리하지 않습니다.</p>
<p>확인할 것: 4→1 연결, 좌우 발 교대, 지지발 미끄러짐, 꼬리 위치, 귀·머리 크기, 옷 장식 유지. <a href="candidate.png">16컷 원본</a></p>
<script>
const canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),image=new Image();
let frames=[],frame=0,playing=true,elapsed=0,last=0;
const names=['FRONT','RIGHT','BACK','LEFT'];
function render(){ctx.fillStyle=document.querySelector('#bg').value;ctx.fillRect(0,0,1200,520);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 for(let row=0;row<4;row++){let d=frames.find(x=>x.direction===names[row]&&x.phase===frame);if(!d)continue;let [x,y,w,h]=d.region;
  for(let band=0;band<2;band++){let s=(band?74:222)/310,ax=150+300*row,ay=band?460:310;ctx.drawImage(image,x,y,w,h,ax-d.root_x*s,ay-d.foot*s,w*s,h*s);ctx.strokeStyle='#57ddd1';ctx.beginPath();ctx.moveTo(ax-12,ay);ctx.lineTo(ax+12,ay);ctx.moveTo(ax,ay-4);ctx.lineTo(ax,ay+4);ctx.stroke();}
  ctx.fillStyle='#81e3d8';ctx.font='16px system-ui';ctx.fillText(names[row],70+row*300,35);
 }document.querySelector('#phase').textContent=`프레임 ${frame+1} / 4`;
}
function tick(t){if(last&&playing){elapsed+=Math.min(t-last,100);let step=1000/Number(document.querySelector('#fps').value);while(elapsed>=step){frame=(frame+1)%4;elapsed-=step;}}last=t;render();requestAnimationFrame(tick);}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'일시정지':'재생';};
document.querySelector('#next').onclick=()=>{playing=false;document.querySelector('#play').textContent='재생';frame=(frame+1)%4;elapsed=0;render();};
document.querySelector('#fps').oninput=e=>{document.querySelector('#rate').textContent=e.target.value;elapsed=0;};
// Embedded metadata supports local file opening without fetch/CORS requirements.
frames=[{"direction": "FRONT", "engine_index": 2, "phase": 0, "region": [0, 0, 305, 326], "root_x": 184, "foot": 317, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "FRONT", "engine_index": 2, "phase": 1, "region": [305, 0, 305, 326], "root_x": 163, "foot": 321, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "FRONT", "engine_index": 2, "phase": 2, "region": [610, 0, 305, 326], "root_x": 134, "foot": 319, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "FRONT", "engine_index": 2, "phase": 3, "region": [915, 0, 304, 326], "root_x": 129, "foot": 319, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "RIGHT", "engine_index": 0, "phase": 0, "region": [0, 326, 305, 307], "root_x": 225, "foot": 301, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "RIGHT", "engine_index": 0, "phase": 1, "region": [305, 326, 305, 307], "root_x": 203, "foot": 301, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "RIGHT", "engine_index": 0, "phase": 2, "region": [610, 326, 305, 307], "root_x": 188, "foot": 301, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "RIGHT", "engine_index": 0, "phase": 3, "region": [915, 326, 304, 307], "root_x": 177, "foot": 301, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "BACK", "engine_index": 6, "phase": 0, "region": [0, 633, 305, 310], "root_x": 166, "foot": 304, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "BACK", "engine_index": 6, "phase": 1, "region": [305, 633, 305, 310], "root_x": 158, "foot": 304, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "BACK", "engine_index": 6, "phase": 2, "region": [610, 633, 305, 310], "root_x": 135, "foot": 304, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "BACK", "engine_index": 6, "phase": 3, "region": [915, 633, 304, 310], "root_x": 150, "foot": 304, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "LEFT", "engine_index": 4, "phase": 0, "region": [0, 943, 305, 337], "root_x": 133, "foot": 321, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "LEFT", "engine_index": 4, "phase": 1, "region": [305, 943, 305, 337], "root_x": 136, "foot": 321, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "LEFT", "engine_index": 4, "phase": 2, "region": [610, 943, 305, 337], "root_x": 119, "foot": 321, "scale_height": 310, "anchor_status": "provisional_manual"}, {"direction": "LEFT", "engine_index": 4, "phase": 3, "region": [915, 943, 304, 337], "root_x": 126, "foot": 321, "scale_height": 310, "anchor_status": "provisional_manual"}];
image.onload=()=>requestAnimationFrame(tick);image.onerror=()=>{document.querySelector('#phase').textContent='candidate.png 로드 실패';};image.src='candidate.png';
</script></html>
